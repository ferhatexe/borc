<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="borçölçme">
  <title>borçölçme</title>
  <!-- Tek renkli işaret: mürekkep zemin, beyaz ölçek yayı ve ibre (borcun eriyişini ölçen gösterge). -->
  <rect width="512" height="512" rx="116" fill="#141414"/>

  <!-- Ölçek: soluk tam yay, dolu kısım ödenen pay -->
  <path d="M120 336a136 136 0 0 1 272 0" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="40" stroke-linecap="round"/>
  <path d="M120 336a136 136 0 0 1 184-127" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round"/>

  <!-- İbre -->
  <g transform="rotate(-34 256 336)">
    <rect x="245" y="196" width="22" height="146" rx="11" fill="#ffffff"/>
  </g>
  <circle cx="256" cy="336" r="34" fill="#ffffff"/>
  <circle cx="256" cy="336" r="13" fill="#141414"/>
</svg>
