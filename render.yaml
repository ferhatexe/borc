services:
  # ---------------------------------------------------------------------------
  # Web servisi (Next.js)
  #
  # NODE_ENV burada BİLEREK tanımlanmıyor. `NODE_ENV=production` ayarlandığında
  # `npm ci` devDependencies'i atlar; typescript, tailwindcss, @tailwindcss/postcss
  # ve prisma CLI kurulmadığı için `next build` başarısız olur. Render zaten
  # çalışma anında NODE_ENV=production kullanır.
  # ---------------------------------------------------------------------------
  - type: web
    name: borcolcme-app
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: >-
      npm ci --include=dev &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npx prisma db seed &&
      npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: borcolcme-db
          property: connectionString
      # En az 32 karakter; oturum jetonları bununla imzalanır.
      - key: JWT_SECRET
        generateValue: true
      # /api/cron/gold uç noktasını korur.
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Seed kullanıcısı: ikisi de ZORUNLU, tanımlı değilse seed hata verir.
      - key: SEED_USER_EMAIL
        sync: false
      - key: SEED_USER_PASSWORD
        sync: false

  # ---------------------------------------------------------------------------
  # Altın fiyat senkronizasyonu (09:00, 13:00, 17:00 TRT = 06:00, 10:00, 14:00 UTC)
  #
  # Script veritabanına doğrudan yazar, web servisine HTTP isteği atmaz; bu yüzden
  # NEXT_PUBLIC_APP_URL'e ihtiyaç duymaz.
  # ---------------------------------------------------------------------------
  - type: cron
    name: borcolcme-gold-sync
    runtime: node
    region: frankfurt
    schedule: "0 6,10,14 * * *"
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm run sync:gold
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: borcolcme-db
          property: connectionString

databases:
  - name: borcolcme-db
    plan: free
    region: frankfurt
    databaseName: borcolcme
    user: borcolcme_user
