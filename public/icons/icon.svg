<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0B"/>
      <stop offset="50%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" opacity="0.35"/>

  <!-- Glowing Outer Aura -->
  <circle cx="256" cy="256" r="140" fill="#10B981" opacity="0.12" filter="url(#glow)"/>

  <!-- Main Vault Shield Outer Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#emeraldGrad)" stroke-width="18" stroke-dasharray="12 8"/>

  <!-- Inner Dynamic Ring (Gold Accented) -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.85"/>

  <!-- Center Hexagonal Bolt / Monogram "B" -->
  <polygon points="256,192 308,222 308,284 256,314 204,284 204,222" fill="#18181B" stroke="url(#emeraldGrad)" stroke-width="8"/>

  <!-- Inner Diamond & Lightning -->
  <polygon points="256,216 286,256 256,296 226,256" fill="url(#emeraldGrad)"/>
  <polygon points="256,232 272,256 256,280 240,256" fill="#FFFFFF"/>
</svg>
