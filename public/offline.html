<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Çevrimdışısınız</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0a0a0b;
        color: #e4e4e7;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { font-size: 0.85rem; color: #a1a1aa; margin: 0 0 20px; max-width: 34ch; }
      button {
        background: #10b981;
        color: #09090b;
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Bağlantı yok</h1>
      <p>
        Finansal verileriniz güvenlik gereği cihazda saklanmaz, bu yüzden çevrimdışıyken
        gösterilemez. Bağlantı geri geldiğinde tekrar deneyin.
      </p>
      <button onclick="location.reload()">Yeniden dene</button>
    </div>
  </body>
</html>
